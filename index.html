<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JD Property">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0B1220">
  <title>JD Property - ระบบนายหน้าอสังหาริมทรัพย์</title>
  <link rel="manifest" href="./manifest.json">
  <script>
    // ← วาง URL ของ Apps Script Web App ที่นี่หลัง Deploy
    window.GAS_URL = 'https://script.google.com/macros/s/AKfycbz30wESm_68SpGPH6rnkFwum4MQFlCJuu0S8wuZEhn3YvvkV2MGEOTCY6DkhQnxO74kvg/exec';
    // ← ใส่ค่าจาก cloudinary.com
    window.CLOUDINARY_CLOUD  = 'dqb2o3mba';
    window.CLOUDINARY_PRESET = 'JD-property';
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Poppins', 'Prompt', 'sans-serif'] },
          colors: {
            primary: { 50:'#EBF0FB', 100:'#D6E1F7', 200:'#ADC3EF', 300:'#84A5E7', 400:'#5B87DF', 500:'#3269D7', 600:'#1B4FD8', 700:'#1543B8', 800:'#1339A8', 900:'#0F2E8A' },
            slate: { 50:'#F8FAFC', 100:'#F1F5F9', 200:'#E2E8F0', 300:'#CBD5E1', 400:'#94A3B8', 500:'#64748B', 600:'#475569', 700:'#334155', 800:'#1E293B', 900:'#0F172A' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="font-sans">

<div class="flex h-screen overflow-hidden" style="background:#F1F5F9">

  <!-- ── Compact Dark Sidebar ───────────────────────── -->
  <aside id="sidebar" style="width:72px;background:#0B1220;display:flex;flex-direction:column;flex-shrink:0;z-index:20">

    <!-- Logo -->
    <div style="padding:18px 0 16px;display:flex;justify-content:center;border-bottom:1px solid rgba(255,255,255,0.07)">
      <div style="width:40px;height:40px;background:linear-gradient(135deg,#5DB85C,#4A9E49);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:13px;letter-spacing:-0.5px">JD</div>
    </div>

    <!-- Nav -->
    <nav style="flex:1;padding:16px 0;display:flex;flex-direction:column;align-items:center;gap:4px">

      <a href="#dashboard" class="nav-icon-btn" data-page="dashboard" title="Dashboard">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      </a>

      <div style="width:32px;height:1px;background:rgba(255,255,255,0.06);margin:8px 0"></div>

      <a href="#customers" class="nav-icon-btn" data-page="customers" title="CRM ลูกค้า">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      </a>

      <div style="width:32px;height:1px;background:rgba(255,255,255,0.06);margin:8px 0"></div>

      <a href="#properties" class="nav-icon-btn" data-page="properties" title="จัดการทรัพย์สิน">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
      </a>
      <a href="#add-property" class="nav-icon-btn" data-page="add-property" title="เพิ่มทรัพย์ใหม่">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 4v16m8-8H4"/></svg>
      </a>

      <div style="width:32px;height:1px;background:rgba(255,255,255,0.06);margin:8px 0"></div>

      <a href="#pipeline" class="nav-icon-btn" data-page="pipeline" title="Sales Pipeline">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
      </a>
      <a href="#appointments" class="nav-icon-btn" data-page="appointments" title="นัดหมาย">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      </a>

      <div style="width:32px;height:1px;background:rgba(255,255,255,0.06);margin:8px 0"></div>

      <a href="#reports" class="nav-icon-btn" data-page="reports" title="รายงานค่านายหน้า">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      </a>

      <a href="#settings" class="nav-icon-btn" data-page="settings" title="ตั้งค่า">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3" stroke-width="1.8"/></svg>
      </a>
    </nav>

    <!-- Avatar -->
    <div style="padding:16px 0;display:flex;justify-content:center;border-top:1px solid rgba(255,255,255,0.07)">
      <div title="JD Property" style="width:38px;height:38px;background:linear-gradient(135deg,#5DB85C,#4A9E49);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;cursor:pointer;border:2px solid rgba(255,255,255,0.15)">JD</div>
    </div>
  </aside>

  <!-- ── Main Area ───────────────────────── -->
  <div class="flex-1 flex flex-col overflow-hidden">

    <!-- Top Header -->
    <header style="background:#fff;border-bottom:1px solid #E8EDF5;padding:0 28px;height:56px;display:flex;align-items:center;justify-content:flex-end;flex-shrink:0">
      <div style="display:flex;align-items:center;gap:10px">
        <div id="notification-bell" style="position:relative;cursor:pointer;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:#F8FAFC;border:1px solid #E8EDF5">
          <svg width="18" height="18" style="color:#64748B" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
          <span id="notif-badge" style="position:absolute;top:8px;right:8px;width:7px;height:7px;background:#EF4444;border-radius:50%;display:none"></span>
        </div>
        <div id="current-date" style="font-size:12px;font-weight:500;color:#64748B;background:#F8FAFC;border:1px solid #E8EDF5;border-radius:10px;padding:8px 14px"></div>
        <div style="display:flex;align-items:center;gap:8px;background:#F8FAFC;border:1px solid #E8EDF5;border-radius:10px;padding:6px 12px;cursor:pointer">
          <div style="width:26px;height:26px;background:linear-gradient(135deg,#5DB85C,#4A9E49);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:9px">JD</div>
          <div style="text-align:center">
            <div style="font-size:12px;font-weight:600;color:#1E293B;line-height:1.2">JD Property</div>
            <div style="font-size:10px;color:#94A3B8">เจ้าของ</div>
          </div>
        </div>
      </div>
    </header>

    <!-- Content -->
    <main id="main-content" class="flex-1 overflow-y-auto" style="padding:24px 28px;background:#F1F5F9">
      <div style="text-align:center;padding:80px 0;color:#94A3B8;font-size:14px">กำลังโหลด...</div>
    </main>
  </div>
</div>

<!-- Toast -->
<div id="toast-container" style="position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px"></div>

<!-- Modal -->
<div id="modal-backdrop" class="fixed inset-0 z-40 hidden flex items-center justify-center" style="background:rgba(11,18,32,0.55);backdrop-filter:blur(3px)">
  <div id="modal-box" style="background:#fff;border-radius:20px;box-shadow:0 24px 60px rgba(0,0,0,0.18);width:100%;max-width:680px;margin:0 16px;max-height:90vh;overflow-y:auto"></div>
</div>

<script src="./js/app.js"></script>
</body>
</html>
